# Hourly billing reconcile. Vercel Hobby only runs crons once a day, so this
# calls the same route every hour; the daily Vercel cron stays as a backup.
# Repo secrets: APP_URL (e.g. https://turbo-start-paystack.vercel.app) and
# CRON_SECRET (the same value as the app's). Until both are set, it skips.
name: Billing reconcile

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the reconcile route
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          # Only the status is printed: this repo's Actions logs are public,
          # and the report can name customers.
          curl --fail --silent --show-error --max-time 120 \
            --output /dev/null --write-out "reconcile: HTTP %{http_code}\n" \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/billing-reconcile"
